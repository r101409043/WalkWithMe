<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walk With Me</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background-color: black;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .navbar .logo a {
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    .menu-toggle {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .menu-toggle div {
      width: 25px;
      height: 3px;
      background-color: white;
      margin: 4px 0;
    }

    .nav-links {
      display: none;
      flex-direction: column;
      background-color: black;
      width: 100%;
      padding: 10px 0;
    }

    .nav-links.active {
      display: flex;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 10px 20px;
    }

    @media (min-width: 769px) {
      .menu-toggle {
        display: none;
      }

      .nav-links {
        display: flex !important;
        flex-direction: row;
        gap: 20px;
        width: auto;
        padding: 0;
      }

      .nav-links a {
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="navbar">
    <div class="logo"><a href="index.html">Walk With Me</a></div>
    <div class="menu-toggle" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="Walkwithme/profile.html">Profile</a>
      <a href="Walkwithme/walkers.html">Walkers</a>
      <a href="Walkwithme/admin.html">Admin</a>
      <a href="Walkwithme/contact.html">Contact</a>
      <a href="Walkwithme/login.html">Login/Signup</a>
    </div>
  </div>

  <script>
    function toggleMenu() {
      const navLinks = document.getElementById('navLinks');
      navLinks.classList.toggle('active');
    }
  </script>

</body>
</html>
