<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Walk With Me</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
    }

    .navbar {
      background-color: black;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px 20px;
    }

    .logo a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    .menu-toggle {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .menu-toggle div {
      width: 25px;
      height: 3px;
      background-color: white;
      margin: 4px 0;
    }

    .navbar-links {
      display: none;
      flex-direction: column;
      background-color: black;
      width: 100%;
      padding: 10px 0;
    }

    .navbar-links.active {
      display: flex;
    }

    .navbar-links a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 10px 20px;
    }

    @media (min-width: 769px) {
      .menu-toggle {
        display: none;
      }

      .navbar-links {
        display: flex !important;
        flex-direction: row;
        gap: 20px;
        width: auto;
        padding: 0;
      }

      .navbar-links a {
        padding: 0;
      }
    }

    .contact-container {
      width: 90%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
    }

    .contact-form button {
      background-color: #1eb723;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }

    .contact-form button:hover {
      background-color: #143815;
    }

    .contact-info {
      margin-top: 20px;
    }

    #statusMessage {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="navbar">
    <div class="logo">
      <a href="index.html">Walk With Me</a>
    </div>
    <div class="menu-toggle" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="navbar-links" id="navLinks">
      <a href="profile.html">Profile</a>
      <a href="walkers.html">Walkers</a>
      <a href="admin.html">Admin</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login/Signup</a>
    </div>
  </div>

  <div class="contact-container">
    <h1>Contact Us</h1>

    <!-- Display Status Message -->
    <div id="statusMessage"></div>

    <!-- Contact Form -->
    <form id="contactForm" class="contact-form">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <p>If you need immediate assistance, please contact campus security:</p>
      <p><strong>UMBC Campus Police Hotline: <a href="tel:+14104555555">+1 (410) 455-5555</a></strong></p>
    </div>
  </div>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('navLinks');
      nav.classList.toggle('active');
    }

    // Handle form submission
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();
      var name = document.getElementById("name").value;
      var email = document.getElementById("email").value;
      var message = document.getElementById("message").value;

      if (!name || !email || !message) {
        document.getElementById("statusMessage").innerHTML = "<p style='color: red;'>Please fill in all fields.</p>";
        return;
      }

      document.getElementById("statusMessage").innerHTML = "<p style='color: green;'>Thank you for reaching out! Your message has been sent successfully.</p>";
      document.getElementById("contactForm").reset();
    });
  </script>
</body>
</html>
